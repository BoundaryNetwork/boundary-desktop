appId: ai.boundary.claw
productName: DabiAI Desktop

# 图标/签名材料在仓库根 build/(本 app 目录无 build/,显式指过去)
directories:
  buildResources: ../../build
  output: dist

# main 已 bundle 自包含(见 electron.vite.config.ts),运行期只需产物 + vendor;不带 node_modules
files:
  - out/**
  - vendor/**
  - package.json
# vendor 经 app:// 用 net.fetch(file://) 读,解包到 asar 外避免 asar 内流式读取问题
asarUnpack:
  - vendor/**

mac:
  category: public.app-category.productivity
  icon: ../../build/icon.icns
  entitlements: ../../build/entitlements.mac.plist
  entitlementsInherit: ../../build/entitlements.mac.inherit.plist
  # 外挂 agentworkerd:把预签名的 worker .app 整体塞进 Contents/Resources/。
  # 运行期由 worker/paths.ts 定位 resourcesPath/clawhost-agentworkerd.app/Contents/MacOS/<bin>。
  extraResources:
    - from: resources/clawhost-agentworkerd.app
      to: clawhost-agentworkerd.app
  # 防重签:osx-sign 默认遍历 Contents 用 entitlementsInherit(无 keychain-access-groups、
  # 不重嵌 profile)强制重签嵌套 .app,会打掉 worker 的 Secure Enclave 访问(-34018)。
  # signIgnore 命中即完全跳过,保留脚本签好的签名。一条正则覆盖该 .app 及其所有子路径。
  signIgnore:
    - "clawhost-agentworkerd\\.app"
  target:
    - target: dmg
      arch:
        - x64
        - arm64

win:
  icon: ../../build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
